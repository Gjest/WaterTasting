spring.application.name=water-tasting

# Embedded Tomcat port (only used when running via `./gradlew bootRun` / the executable war).
# When deployed to an external Tomcat this is ignored and Tomcat's own port/context apply.
server.port=8080
server.servlet.context-path=/

# H2 file database - persists across restarts.
# DB file: default is ./data/watertasting.mv.db relative to the working directory
# of the Tomcat process. Since Tomcat's working dir and write permissions vary,
# the location can be overridden via the env var WATERTASTING_DB_PATH, e.g. in
# Tomcat's $CATALINA_BASE/bin/setenv.sh:
#   export WATERTASTING_DB_PATH=/opt/watertasting/watertasting
# The target folder must exist and be writable by the Tomcat user.
spring.datasource.url=jdbc:h2:file:${WATERTASTING_DB_PATH:./data/watertasting};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# ddl-auto=update is the only schema management in this project: it adds new
# columns/tables but never drops, renames, or migrates data. If a real schema
# migration is ever needed, introduce Flyway or Liquibase instead of relying on it.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# H2 web console: disabled. It exposes an unauthenticated SQL shell (sa / empty
# password) to anyone who can reach the app. Enable temporarily on a trusted
# machine only if you need raw DB access.
spring.h2.console.enabled=false

spring.thymeleaf.cache=false
