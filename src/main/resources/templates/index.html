<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Water Tasting - D&D Weekend</title>
    <link th:href="@{/vendor/fonts.css}" rel="stylesheet">
    <link th:href="@{/vendor/tailwind.css}" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-body min-h-screen antialiased">

<header class="sticky top-0 z-10 border-b border-amber-500/20 bg-slate-950/90 backdrop-blur">
    <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
        <div>
            <h1 class="font-display text-lg sm:text-xl font-bold text-amber-400 tracking-wide">Water Tasting</h1>
            <p class="text-xs text-slate-400">Adventurer's Guild &middot; D&D Weekend</p>
        </div>
        <a th:href="@{/results}"
           class="shrink-0 text-sm font-semibold text-slate-200 border border-slate-700 rounded-lg px-3 py-1.5 hover:border-amber-400 hover:text-amber-300 transition-colors">
            Results
        </a>
    </div>
</header>

<main class="max-w-2xl mx-auto px-4 pb-20">

    <div th:if="${success}" th:text="${success}"
         class="mt-5 rounded-lg border border-emerald-500/40 bg-emerald-500/10 text-emerald-300 px-4 py-3 text-sm font-semibold">
    </div>

    <div class="mt-8 mb-6">
        <h2 class="font-display text-2xl font-bold text-slate-100">The Tasting</h2>
        <p class="mt-1 text-sm text-slate-400">
            Swirl, sniff, sip, and judge. Each metric runs from
            <span class="text-amber-300">[1]</span> to
            <span class="text-amber-300">[5]</span>.
        </p>
    </div>

    <form th:action="@{/submit}" th:object="${tasting}" method="post"
          class="space-y-8">

        <div class="space-y-4">
            <div>
                <label for="adventurerName" class="block text-sm font-semibold text-slate-200">Adventurer Name</label>
                <input type="text" id="adventurerName" th:field="*{adventurerName}"
                       placeholder="Who is tasting?" maxlength="255"
                       class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-2.5 text-sm placeholder-slate-500 focus:border-amber-400 focus:outline-none focus:ring-1 focus:ring-amber-400">
                <p th:if="${#fields.hasErrors('adventurerName')}" th:errors="*{adventurerName}"
                   class="mt-1 text-xs text-rose-400"></p>
            </div>
            <div>
                <label for="waterSampleId" class="block text-sm font-semibold text-slate-200">Water Sample ID</label>
                <input type="text" id="waterSampleId" th:field="*{waterSampleId}"
                       placeholder="e.g. SAMPLE-01 or Dungeon Spring" maxlength="255"
                       class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-2.5 text-sm placeholder-slate-500 focus:border-amber-400 focus:outline-none focus:ring-1 focus:ring-amber-400">
                <p th:if="${#fields.hasErrors('waterSampleId')}" th:errors="*{waterSampleId}"
                   class="mt-1 text-xs text-rose-400"></p>
            </div>
        </div>

        <section th:each="section : ${sections}">
            <h3 class="font-display text-sm font-bold uppercase tracking-widest text-amber-500"
                th:text="${section.title()}">Section</h3>
            <div class="mt-3 space-y-3">
                <div th:each="field : ${section.fields()}" class="slider-card rounded-xl border p-4"
                     th:classappend="${field.highlight()} ? 'border-amber-400/30 bg-amber-400/5' : 'border-slate-800 bg-slate-900/60'">
                    <div class="flex items-center justify-between gap-3">
                        <label th:for="${field.id()}" class="text-sm font-semibold"
                               th:classappend="${field.highlight()} ? 'text-slate-100' : 'text-slate-200'"
                               th:text="${field.label()}">Metric</label>
                        <span class="value-badge text-sm font-bold text-amber-300 bg-amber-400/10 border border-amber-400/30 rounded-lg px-2 py-0.5">3</span>
                    </div>
                    <p class="mt-1 text-xs" th:classappend="${field.highlight()} ? 'text-slate-400' : 'text-slate-500'"
                       th:text="${field.caption()}">Caption</p>
                    <input type="range" th:field="*{__${field.id()}__}" min="1" max="5" step="1"
                           class="mt-3 w-full accent-amber-400 cursor-pointer"
                           oninput="updateValue(this)">
                </div>
            </div>
        </section>

        <section>
            <h3 class="font-display text-sm font-bold uppercase tracking-widest text-amber-500">Adventurer's Notes</h3>
            <div class="mt-3">
                <textarea id="notes" th:field="*{notes}" rows="4" maxlength="2000"
                          placeholder='e.g. Tastes like it was filtered through a dragon&apos;s scale.'
                          class="w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-2.5 text-sm placeholder-slate-500 focus:border-amber-400 focus:outline-none focus:ring-1 focus:ring-amber-400"></textarea>
            </div>
        </section>

        <button type="submit"
                class="w-full rounded-xl bg-amber-400 px-6 py-3.5 text-base font-bold text-slate-950 shadow-lg shadow-amber-400/20 hover:bg-amber-300 active:scale-[0.99] transition-all">
            Record Tasting
        </button>
    </form>
</main>

<script>
    function updateValue(slider) {
        const badge = slider.closest('.slider-card').querySelector('.value-badge');
        if (badge) {
            badge.textContent = slider.value;
        }
    }

    // Badges are static markup; sync them to the actual slider positions on load,
    // which also covers restored form state and validation-error re-renders.
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.slider-card input[type="range"]').forEach(updateValue);
    });
</script>

</body>
</html>
