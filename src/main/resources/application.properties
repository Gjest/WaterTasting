spring.application.name=water-tasting

# Embedded Tomcat port (only used when running via `mvn spring-boot:run` / the executable war).
# When deployed to an external Tomcat this is ignored and Tomcat's own port/context apply.
server.port=8080
server.servlet.context-path=/

# H2 in-memory database - no installation required, wiped on restart.
spring.datasource.url=jdbc:h2:mem:watertasting;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# H2 web console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.thymeleaf.cache=false
